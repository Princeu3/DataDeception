name: Build paper PDF

on:
  push:
    paths:
      - 'paper/**'
      - 'data/**'
      - '.github/workflows/paper.yml'
  pull_request:
    paths:
      - 'paper/**'
      - 'data/**'
  workflow_dispatch:

jobs:
  build-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema referencing

      - name: Validate dataset
        run: python validate.py

      - name: Regenerate figures
        run: python paper/figures/generate.py

      - name: Lint LaTeX (chktex)
        # chktex ships with TeX Live (xu-cheng/latex-action). Non-zero exit doesn't fail
        # the build — surfaces warnings in the run log for review.
        run: |
          docker run --rm -v "$PWD/paper:/work" -w /work texlive/texlive:latest \
            chktex -q -n8 -n13 -n44 main.tex || true
        continue-on-error: true

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper
          root_file: main.tex
          latexmk_use_xelatex: false
          extra_system_packages: ""
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: DataDeception-paper-pdf
          path: paper/main.pdf
          if-no-files-found: error

      - name: Upload LaTeX log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: latex-log
          path: |
            paper/main.log
            paper/main.aux
